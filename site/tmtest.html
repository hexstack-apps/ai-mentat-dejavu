<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TM MobileNet probe</title>
<style>body{background:#0d1117;color:#c9d1d9;font:13px/1.6 ui-monospace,monospace;padding:12px}
#o{white-space:pre-wrap}.g{color:#3fb950}.r{color:#f85149}.o{color:#f0883e}</style></head>
<body><div id="o">…</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu@4.22.0/dist/tf-backend-cpu.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-layers@4.22.0/dist/tf-layers.min.js"></script>
<script type="module">
const O=document.getElementById('o');
const say=(m,c)=>{O.innerHTML+=`\n${c?`<span class=${c}>${m}</span>`:m}`;
  window.__l=(window.__l||[]).concat(m);};
window.__done=false;
try{
  const tf = window.tf;
  say('tfjs '+tf.version_core+' backends: '+Object.keys(tf.engine().registryFactory).join(','));
  // prefer webgl (GPU) and fall back to cpu — measure BOTH
  const results={};
  for (const be of ['webgl','cpu']) {
    try {
      await tf.setBackend(be); await tf.ready();
      say(`backend ${be}: ready`,'g');
      results[be]={};
    } catch(e){ say(`backend ${be}: ${e.message}`.slice(0,90),'r'); continue; }

    // TM's own feature extractor: MobileNet v2 alpha 0.35, no classifier head
    const URL='https://storage.googleapis.com/teachable-machine-models/'+
      'mobilenet_v2_weights_tf_dim_ordering_tf_kernels_0.35_224_no_top/model.json';
    const t0=performance.now();
    const m = window.__m || await tf.loadLayersModel(URL);
    window.__m = m;
    results[be].loadMs = Math.round(performance.now()-t0);
    say(`  loaded in ${results[be].loadMs} ms · output ${JSON.stringify(m.outputs[0].shape)}`,'g');

    // one 224x224 frame
    const cv=document.createElement('canvas'); cv.width=cv.height=224;
    const cx=cv.getContext('2d');
    cx.fillStyle='#3c3c3c'; cx.fillRect(0,0,224,224);
    cx.fillStyle='#c83232'; cx.beginPath(); cx.arc(112,112,60,0,7); cx.fill();

    const embed = () => tf.tidy(()=>{
      const px = tf.expandDims(tf.sub(tf.div(tf.cast(tf.browser.fromPixels(cv),'float32'),127.5),1),0);
      const out = m.predict(px);                 // [1,7,7,1280]
      return tf.squeeze(tf.mean(out,[1,2]));          // global average pool -> [1280]
    });
    const warm = embed(); const dim = warm.shape[0]; warm.dispose();
    const ts=[];
    for(let i=0;i<5;i++){ const s=performance.now(); const v=embed(); await v.data(); v.dispose(); ts.push(performance.now()-s); }
    ts.sort((a,b)=>a-b);
    results[be].med = Math.round(ts[2]); results[be].dim = dim;
    say(`  embed dim ${dim} · median ${results[be].med} ms`,'g');
  }
  window.__res=results;
  window.__done=true;
  say('DONE','o');
}catch(e){ say('FAILED: '+(e&&e.message||e),'r'); window.__err=String(e&&e.message||e); window.__done=true; }
</script></body></html>
